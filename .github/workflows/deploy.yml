name: wxread

# 同一时间只跑一个阅读任务。后一个定时触发排队，不取消正在进行的阅读。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  schedule:
    # GitHub 在高峰期会推迟 schedule，负载过高时直接丢弃且不留下 run。
    # 只有 01:07 一个时刻时，上海时间 2026-11-08、11-09、11-24 没有 schedule 运行，
    # 11-10 只有手动运行。下面的时刻都按 Asia/Shanghai，并错开整点。
    # 同一上海日只有第一次成功阅读会执行 main.py。之后的定时触发和
    # workflow_dispatch 都由 daily gate 跳过，避免补跑和迟到的 cron 各读一次。
    - cron: '7 1 * * *'    # 01:07
      timezone: Asia/Shanghai
    - cron: '17 5 * * *'   # 05:17
      timezone: Asia/Shanghai
    - cron: '29 9 * * *'   # 09:29
      timezone: Asia/Shanghai
    - cron: '41 14 * * *'  # 14:41
      timezone: Asia/Shanghai
    - cron: '53 18 * * *'  # 18:53
      timezone: Asia/Shanghai
  workflow_dispatch:  # 手动触发

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: AutoRead  # 指定环境
    permissions:
      actions: read
      contents: read

    steps:

    - name: Set DNS to Google's DNS
      run: |
        echo "nameserver 8.8.8.8" | sudo tee /etc/resolv.conf
        echo "nameserver 8.8.4.4" | sudo tee -a /etc/resolv.conf

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'

    - name: Decide whether this Shanghai day still needs a read
      id: daily
      env:
        GH_TOKEN: ${{ github.token }}
      run: python scripts/daily_gate.py

    - name: Install dependencies
      if: steps.daily.outputs.read == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install certifi==2024.8.30 charset-normalizer==3.4.0 idna==3.10 requests==2.32.3 urllib3==2.2.3

    - name: Run deployment script
      if: steps.daily.outputs.read == 'true'
      env:
        WXREAD_CURL_BASH: ${{ secrets.WXREAD_CURL_BASH }}
        PUSH_METHOD: ${{ secrets.PUSH_METHOD }}
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        SERVERCHAN_SPT:  ${{ secrets.SERVERCHAN_SPT }}
        READ_NUM: ${{ vars.READ_NUM }}  # 使用 Repository Variables

      run: |
        python main.py

  # 每次运行后重新 enable，避免公开仓库 60 天无活动后定时任务被关掉。
  # 这个 API 会刷新 workflow 的 updated_at，那不是工作流文件被提交修改。
  keepalive-job:
    name: Keepalive Workflow
    if: ${{ always() && !cancelled() }}
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@v1.2.1
